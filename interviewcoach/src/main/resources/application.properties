# Server Configuration
server.port=8080
server.servlet.context-path=/


# Application Name
spring.application.name=interviewcoach


# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/interviewcoach
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false


# JWT Configuration
app.jwt.secret=c2VjcmV0LWtleS1mb3ItaW50ZXJ2aWV3LWNvYWNoLWFwcC1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1wbGVhc2U=
app.jwt.expiration-ms=86400000


# Gemini API Configuration
gemini.api-key=
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent


# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html